services:
  # ORACLE XE DB
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle_db
    environment:
      - ORACLE_PASSWORD=oracle
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # BACKEND: FastAPI app
  backend:
    build: ./backend
    container_name: backend_app
    environment:
      - DB_USER=system
      - DB_PASS=oracle
      - DB_DSN=oracle:1521/xe
    ports:
      - "8000:8000"
    depends_on:
      oracle:
        condition: service_healthy

  # FRONTEND: Nginx + HTML
  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "8080:80"
    depends_on:
      - backend